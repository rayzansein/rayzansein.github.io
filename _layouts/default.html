<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap">
{% feed_meta %}
<style>
  body { margin: 0 auto; max-width: 680px; padding: 32px 16px; font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.7; background: #fff; color: #444; }
  header { margin-bottom: 40px; }
  header a { font-weight: 700; color: #333; text-decoration: none; }
  h1, h2 { letter-spacing: -0.02em; color: #333; }
  a { color: #333; }
  img { max-width: 100%; }
  pre { overflow-x: auto; background: #f5f5f5; padding: 12px; }
  time { color: #777; font-size: 0.9rem; }
  ul.posts { list-style: none; padding: 0; }
  ul.posts li { margin-bottom: 12px; }
</style>
</head>
<body>
  <header><a href="/">{{ site.title }}</a> / <a href="/blog/">Blog</a></header>
  <main>
    {% if page.date %}<h1>{{ page.title }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% endif %}
    {{ content }}
  </main>
</body>
</html>
